name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build
      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path target/release/nevixplore.exe `
            -DestinationPath "out/NevIxplore-$tag-portable.zip"
          $setup = Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced under target/release/bundle/nsis" }
          Copy-Item $setup.FullName "out/NevIxplore-$tag-setup.exe"
          Get-ChildItem out | Select-Object Name, Length
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: false
          prerelease: false
